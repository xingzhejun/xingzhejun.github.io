short_bio: >-
  <p>
    I am an incoming Ph.D. student at <a href="https://www.tum.de/en/" target="_blank">Technical University of Munich</a>, majoring in computer science and supervised by <a href="https://www.gov.sot.tum.de/rds/prof-dr-gjergji-kasneci/" target="_blank">Prof. Dr. Gjergji Kasneci</a>. Prior to that,I recieved my master degree from <a href="https://www.tsinghua.edu.cn/en/" target="_blank">Tsinghua University</a>, majoring in Artificial Intelligence. I received my bachelor degree also from Tsinghua University, in the department of <a href="https://www.ee.tsinghua.edu.cn/en/" target="_blank">Electronic Engineering</a>.
  </p>
  <p>
    My research interests focus on the post-training paradigm (mainly as RL and OPD), for both LLMs and diffusion models. I have several top-tier publications as well as frontier lab internship experiences in this area.
  </p>
  <p>
    <strong>I am always actively looking for research internship opportunities</strong>. Feel free to reach out to me if there is a match!
  </p>
  <p>
    I am also opened to collaboration, <strong>especially (1) if you can give me SSH access to a large GPU cluster, or (2) if you are seeking for some hands-on guidance</strong>. If you are interested, please drop me an email. I check it every day!
  </p>

