short_bio: >-
  <p>
    I am a master student at Tsinghua University, majoring in Artificial Intelligence. Prior to that, I received my bachelor degree also from Tsinghua University, in the department of Electronic Engineering.
  </p>
  <p>
    My research interests focus on the post-training paradigm (mainly as RL and OPD), for both LLMs and diffusion models. I have several top-tier publications as well as frontier lab internship experiences in this area.
  </p>
  <p>
    I am always actively looking for research internship opportunities. Feel free to reach out to me if there is a match!
  </p>
  <p>
    I am also opened to collaboration, especially (1) if you can give me SSH access to a large GPU cluster, or (2) if you are seeking for some hands-on guidance. If you are interested, please drop me an email. I check it every day!
  </p>

